name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Get version name
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Rename APKs
        run: |
          mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/NewsApp-${{ steps.version.outputs.VERSION }}-release.apk
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/NewsApp-${{ steps.version.outputs.VERSION }}-debug.apk

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          release_name: News App v${{ steps.version.outputs.VERSION }}
          body: |
            ## News App Release v${{ steps.version.outputs.VERSION }}

            ### Downloads
            - **Release APK**: Production-ready build (recommended for most users)
            - **Debug APK**: Development build with debugging enabled

            ### Installation Instructions
            1. Download the APK file
            2. Enable "Install from Unknown Sources" in your Android settings
            3. Open the downloaded APK file and install

            ### What's New
            Check the commit history for detailed changes.

            ---
            Built with ❤️ using GitHub Actions
          draft: false
          prerelease: false

      - name: Upload Release APK
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: app/build/outputs/apk/release/NewsApp-${{ steps.version.outputs.VERSION }}-release.apk
          asset_name: NewsApp-${{ steps.version.outputs.VERSION }}-release.apk
          asset_content_type: application/vnd.android.package-archive

      - name: Upload Debug APK
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: app/build/outputs/apk/debug/NewsApp-${{ steps.version.outputs.VERSION }}-debug.apk
          asset_name: NewsApp-${{ steps.version.outputs.VERSION }}-debug.apk
          asset_content_type: application/vnd.android.package-archive

      - name: Upload artifacts to workflow
        uses: actions/upload-artifact@v4
        with:
          name: release-apks-v${{ steps.version.outputs.VERSION }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          retention-days: 90
