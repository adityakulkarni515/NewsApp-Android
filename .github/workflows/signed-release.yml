name: Signed Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  signed-release:
    name: Create Signed Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          echo $ENCODED_KEYSTORE | base64 -di > keystore.jks

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=../keystore.jks \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD \
            --stacktrace

      - name: Build signed release AAB (for Play Store)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=../keystore.jks \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD \
            --stacktrace

      - name: Rename signed artifacts
        run: |
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/NewsApp-${{ github.event.inputs.version }}-release-signed.apk
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            mv app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/NewsApp-${{ github.event.inputs.version }}-release.aab
          fi

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.event.inputs.version }}
          release_name: News App v${{ github.event.inputs.version }} (Signed)
          body: |
            ## News App Signed Release v${{ github.event.inputs.version }}

            ### Downloads
            - **Signed APK**: Production-ready signed build
            - **AAB**: Android App Bundle for Google Play Store

            ### Installation Instructions
            #### For APK:
            1. Download the signed APK file
            2. Enable "Install from Unknown Sources" in your Android settings
            3. Open the downloaded APK file and install

            #### For Play Store:
            Upload the AAB file to Google Play Console

            ---
            Built and signed with GitHub Actions
          draft: false
          prerelease: false

      - name: Upload Signed APK
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: app/build/outputs/apk/release/NewsApp-${{ github.event.inputs.version }}-release-signed.apk
          asset_name: NewsApp-${{ github.event.inputs.version }}-release-signed.apk
          asset_content_type: application/vnd.android.package-archive

      - name: Upload AAB
        uses: actions/upload-release-asset@v1
        if: hashFiles('app/build/outputs/bundle/release/NewsApp-${{ github.event.inputs.version }}-release.aab') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: app/build/outputs/bundle/release/NewsApp-${{ github.event.inputs.version }}-release.aab
          asset_name: NewsApp-${{ github.event.inputs.version }}-release.aab
          asset_content_type: application/octet-stream

      - name: Upload artifacts to workflow
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-v${{ github.event.inputs.version }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          retention-days: 90

      - name: Cleanup keystore
        if: always()
        run: rm -f keystore.jks
